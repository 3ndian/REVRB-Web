<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050508">
<title>Revrb web</title>
<style>
:root{--bg:#050508;--panel:#101213;--line:#2c2f32;--ink:#e8ecef;--dim:#9aa3a0;--acc:#9DF2A5;--onacc:#07110c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,system-ui,Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 24px);max-width:520px;margin:0 auto}
h1{font-size:13px;letter-spacing:.18em;font-weight:800;margin:14px 2px 10px;color:var(--dim)}
.stage{position:relative;width:100%;border-radius:22px;overflow:hidden;background:#0b0d0e;border:1px solid var(--line);aspect-ratio:3/4}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.stage .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--dim)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.badge{position:absolute;left:12px;top:12px;padding:5px 10px;border-radius:12px;background:rgba(0,0,0,.6);font-size:12px;letter-spacing:.08em}
.row{display:flex;gap:10px;align-items:center;margin-top:12px}
.row.c{justify-content:center}
button,select,label.btn{font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;min-height:46px}
button.pri,label.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:800}
button:disabled{opacity:.4}
button.chip{padding:8px 12px;min-height:38px;border-radius:19px}
button.chip.on{border-color:var(--acc);color:var(--acc)}
label.btn{display:inline-flex;align-items:center;justify-content:center}
input[type=file]{display:none}
.shutter{width:76px;height:76px;border-radius:50%;border:3px solid #fff;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
.shutter i{display:block;width:60px;height:60px;border-radius:50%;background:#f4f6f4}
.shutter:disabled{opacity:.4}
.grow{flex:1}
.panel{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px}
.sl{display:grid;grid-template-columns:92px 1fr 40px;gap:8px;align-items:center;margin:8px 0}
.sl span{font-size:11px;letter-spacing:.12em;color:var(--dim);font-weight:700}
.sl output{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
input[type=range]{width:100%;accent-color:#9DF2A5;height:30px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.small{font-size:12px;color:var(--dim)}
.out{margin-top:14px;text-align:center}
.out img,.out video{max-width:100%;border-radius:16px;border:1px solid var(--line)}
a.dl{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;min-height:46px}
.hide{display:none!important}
#status{min-height:20px;margin-top:10px;color:var(--dim);font-size:13px;text-align:center}
</style>
</head>
<body>
<h1>REVRB WEB &middot; BURST TEST</h1>

<div class="stage" id="stage">
  <video id="live" playsinline muted autoplay class="hide"></video>
  <canvas id="view" class="hide"></canvas>
  <div class="msg" id="msg">Tap Start camera. If the camera does not open, use Pick photos.</div>
  <div class="badge hide" id="badge"></div>
  <div class="flash" id="flash"></div>
</div>

<div id="status"></div>

<!-- camera controls -->
<div id="camBar">
  <div class="row c">
    <button id="start" class="pri">Start camera</button>
    <label class="btn" for="pick">Pick photos</label>
    <input id="pick" type="file" accept="image/*" multiple>
  </div>
  <div class="row c hide" id="shootRow">
    <button id="flip" aria-label="Flip camera">Flip</button>
    <button id="shutter" class="shutter" aria-label="Burst"><i></i></button>
    <div style="width:64px"></div>
  </div>
  <div class="row c small">
    <span>Frames</span>
    <select id="nFrames"><option>3</option><option>4</option><option selected>5</option><option>6</option><option>8</option><option>10</option></select>
    <span>Gap</span>
    <select id="gap"><option value="0">fastest</option><option value="80">80 ms</option><option value="150" selected>150 ms</option><option value="300">300 ms</option><option value="600">600 ms</option></select>
  </div>
</div>

<!-- edit controls -->
<div id="editBar" class="hide">
  <div class="panel">
    <div class="chips" id="looks"></div>
    <div id="sliders"></div>
    <div class="row">
      <span class="small" style="width:92px;letter-spacing:.12em;font-weight:700">LOOP</span>
      <button class="chip on" id="loopPP">Ping-pong</button>
      <button class="chip" id="loopFw">Forward</button>
    </div>
  </div>
  <div class="row c">
    <button id="retake">Retake</button>
    <button id="expGif" class="pri grow">Make GIF</button>
    <button id="expVid">Make video</button>
  </div>
  <div class="out hide" id="out"></div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const live = $('live'), view = $('view'), vctx = view.getContext('2d', { willReadFrequently: true });
const state = { stream: null, facing: 'environment', raw: [], proc: [], W: 0, H: 0, fps: 8, pingpong: true, timer: null, tick: 0, busy: false,
  p: { brightness: 0, contrast: 0, saturation: 0, warmth: 0, fade: 0, grain: 0 }, look: 'None' };

function say(t) { $('status').textContent = t || ''; }
function showMsg(t) { $('msg').textContent = t; $('msg').classList.remove('hide'); }

/* ---------- camera ---------- */
async function startCamera() {
  say('');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { showMsg('This browser has no camera access here. It needs https. Use Pick photos instead.'); return; }
  try {
    if (state.stream) state.stream.getTracks().forEach((t) => t.stop());
    state.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: state.facing }, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
    live.srcObject = state.stream;
    await live.play();
    live.classList.remove('hide'); view.classList.add('hide'); $('msg').classList.add('hide');
    $('shootRow').classList.remove('hide'); $('start').classList.add('hide');
    $('camBar').classList.remove('hide'); $('editBar').classList.add('hide');
    stopLoop();
    $('stage').style.aspectRatio = (live.videoWidth || 3) + '/' + (live.videoHeight || 4);
  } catch (e) {
    showMsg('Camera did not open: ' + (e && e.name ? e.name : e) + '. Check Settings > Safari > Camera, or use Pick photos.');
  }
}
$('start').onclick = startCamera;
$('flip').onclick = () => { state.facing = state.facing === 'environment' ? 'user' : 'environment'; startCamera(); };

function sizeFor(vw, vh) { const W = 540; return [W, Math.max(2, Math.round(W * vh / vw))]; }
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

$('shutter').onclick = async () => {
  if (state.busy || !live.videoWidth) return;
  state.busy = true; $('shutter').disabled = true;
  const n = +$('nFrames').value, gap = +$('gap').value;
  const [W, H] = sizeFor(live.videoWidth, live.videoHeight);
  state.W = W; state.H = H; view.width = W; view.height = H;
  const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H; const tctx = tmp.getContext('2d', { willReadFrequently: true });
  const raw = [];
  $('flash').style.opacity = .8; setTimeout(() => ($('flash').style.opacity = 0), 90);
  for (let i = 0; i < n; i++) {
    const t0 = performance.now();
    tctx.drawImage(live, 0, 0, W, H);
    raw.push(tctx.getImageData(0, 0, W, H));
    say('Frame ' + (i + 1) + ' of ' + n);
    const used = performance.now() - t0;
    if (gap > used) await wait(gap - used); else await wait(0);
  }
  state.busy = false; $('shutter').disabled = false;
  openEditor(raw);
};

/* ---------- photos instead of camera ---------- */
$('pick').onchange = async (e) => {
  const files = Array.from(e.target.files || []).slice(0, 12); if (!files.length) return;
  say('Loading photos...');
  const imgs = [];
  for (const f of files) { try { imgs.push(await createImageBitmap(f)); } catch (err) { try { imgs.push(await loadImg(f)); } catch (e2) {} } }
  if (!imgs.length) { say('Could not read those photos.'); return; }
  const [W, H] = sizeFor(imgs[0].width, imgs[0].height);
  state.W = W; state.H = H; view.width = W; view.height = H;
  const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H; const tctx = tmp.getContext('2d', { willReadFrequently: true });
  const raw = imgs.map((im) => {
    const s = Math.max(W / im.width, H / im.height), dw = im.width * s, dh = im.height * s;
    tctx.fillStyle = '#000'; tctx.fillRect(0, 0, W, H); tctx.drawImage(im, (W - dw) / 2, (H - dh) / 2, dw, dh);
    return tctx.getImageData(0, 0, W, H);
  });
  e.target.value = '';
  openEditor(raw);
};
function loadImg(file) { return new Promise((res, rej) => { const u = URL.createObjectURL(file), i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = u; }); }

/* ---------- processing ---------- */
const LOOKS = {
  'None': { brightness: 0, contrast: 0, saturation: 0, warmth: 0, fade: 0, grain: 0 },
  'Warm': { brightness: 4, contrast: 6, saturation: 12, warmth: 22, fade: 10, grain: 8 },
  'Cool': { brightness: 0, contrast: 8, saturation: -6, warmth: -24, fade: 6, grain: 8 },
  'Mono': { brightness: 2, contrast: 18, saturation: -100, warmth: 0, fade: 4, grain: 20 },
  'Film': { brightness: 2, contrast: 10, saturation: -14, warmth: 12, fade: 22, grain: 26 }
};
const SLIDERS = [['brightness', 'BRIGHTNESS', -50, 50], ['contrast', 'CONTRAST', -50, 50], ['saturation', 'SATURATION', -100, 100], ['warmth', 'WARMTH', -50, 50], ['fade', 'FADE', 0, 50], ['grain', 'GRAIN', 0, 50]];

function processFrame(src, p, idx) {
  const out = new ImageData(src.width, src.height), s = src.data, d = out.data, n = s.length;
  const br = p.brightness * 2.55, cf = 1 + p.contrast / 100, sat = 1 + p.saturation / 100, w = p.warmth * 0.6;
  const fade = p.fade / 100, g = p.grain * 2.4;
  let seed = (idx + 1) * 2654435761 >>> 0;
  for (let i = 0; i < n; i += 4) {
    let r = s[i], gg = s[i + 1], b = s[i + 2];
    r += br; gg += br; b += br;
    r = (r - 128) * cf + 128; gg = (gg - 128) * cf + 128; b = (b - 128) * cf + 128;
    const gray = 0.299 * r + 0.587 * gg + 0.114 * b;
    r = gray + (r - gray) * sat; gg = gray + (gg - gray) * sat; b = gray + (b - gray) * sat;
    r += w; b -= w;
    if (fade) { r = r * (1 - fade) + 255 * fade * 0.35; gg = gg * (1 - fade) + 255 * fade * 0.35; b = b * (1 - fade) + 255 * fade * 0.35; }
    if (g) { seed ^= seed << 13; seed >>>= 0; seed ^= seed >>> 17; seed ^= seed << 5; seed >>>= 0; const nz = ((seed & 1023) / 1023 - 0.5) * g; r += nz; gg += nz; b += nz; }
    d[i] = r < 0 ? 0 : r > 255 ? 255 : r; d[i + 1] = gg < 0 ? 0 : gg > 255 ? 255 : gg; d[i + 2] = b < 0 ? 0 : b > 255 ? 255 : b; d[i + 3] = 255;
  }
  return out;
}
let procQueued = false;
function reprocess() {
  if (procQueued) return; procQueued = true;
  requestAnimationFrame(() => {
    procQueued = false;
    state.proc = state.raw.map((f, i) => processFrame(f, state.p, i));
  });
}

/* ---------- editor ---------- */
function order() {
  const n = state.proc.length || state.raw.length, o = [];
  for (let i = 0; i < n; i++) o.push(i);
  if (state.pingpong && n > 2) for (let i = n - 2; i >= 1; i--) o.push(i);
  return o;
}
function openEditor(raw) {
  state.raw = raw; state.proc = raw.map((f, i) => processFrame(f, state.p, i));
  live.classList.add('hide'); view.classList.remove('hide'); $('msg').classList.add('hide');
  $('stage').style.aspectRatio = state.W + '/' + state.H;
  $('camBar').classList.add('hide'); $('editBar').classList.remove('hide'); $('out').classList.add('hide'); $('out').innerHTML = '';
  $('badge').classList.remove('hide'); say('');
  startLoop();
}
function startLoop() {
  stopLoop();
  const step = () => {
    const o = order(); if (!o.length) return;
    state.tick = (state.tick + 1) % o.length;
    const f = state.proc[o[state.tick]]; if (f) vctx.putImageData(f, 0, 0);
    $('badge').textContent = (o[state.tick] + 1) + ' / ' + state.raw.length + '  ·  ' + state.fps + ' fps';
  };
  state.timer = setInterval(step, 1000 / state.fps); step();
}
function stopLoop() { if (state.timer) clearInterval(state.timer); state.timer = null; $('badge').classList.add('hide'); }

function buildUI() {
  const looks = $('looks');
  Object.keys(LOOKS).forEach((k) => {
    const b = document.createElement('button'); b.className = 'chip' + (k === state.look ? ' on' : ''); b.textContent = k;
    b.onclick = () => { state.look = k; Object.assign(state.p, LOOKS[k]); syncSliders(); reprocess(); Array.from(looks.children).forEach((c) => c.classList.toggle('on', c.textContent === k)); };
    looks.appendChild(b);
  });
  const box = $('sliders');
  SLIDERS.concat([['fps', 'SPEED (FPS)', 2, 20]]).forEach(([k, label, mn, mx]) => {
    const row = document.createElement('div'); row.className = 'sl';
    row.innerHTML = '<span>' + label + '</span><input type="range" id="s_' + k + '" min="' + mn + '" max="' + mx + '" step="1"><output id="o_' + k + '"></output>';
    box.appendChild(row);
    const inp = row.querySelector('input');
    inp.oninput = () => {
      const v = +inp.value; $('o_' + k).textContent = v;
      if (k === 'fps') { state.fps = v; if (state.raw.length) startLoop(); }
      else { state.p[k] = v; state.look = 'Custom'; Array.from(looks.children).forEach((c) => c.classList.remove('on')); reprocess(); }
    };
  });
  syncSliders();
}
function syncSliders() {
  SLIDERS.forEach(([k]) => { $('s_' + k).value = state.p[k]; $('o_' + k).textContent = state.p[k]; });
  $('s_fps').value = state.fps; $('o_fps').textContent = state.fps;
}
$('loopPP').onclick = () => { state.pingpong = true; $('loopPP').classList.add('on'); $('loopFw').classList.remove('on'); startLoop(); };
$('loopFw').onclick = () => { state.pingpong = false; $('loopFw').classList.add('on'); $('loopPP').classList.remove('on'); startLoop(); };
$('retake').onclick = () => { stopLoop(); state.raw = []; state.proc = []; if (state.stream) startCamera(); else { view.classList.add('hide'); $('msg').classList.remove('hide'); $('camBar').classList.remove('hide'); $('editBar').classList.add('hide'); } };

/* ---------- export ---------- */
function offerFile(blob, name, kind) {
  const url = URL.createObjectURL(blob), out = $('out');
  out.classList.remove('hide');
  out.innerHTML = '';
  const el = kind === 'gif' ? document.createElement('img') : document.createElement('video');
  el.src = url; if (kind !== 'gif') { el.controls = true; el.loop = true; el.muted = true; el.playsInline = true; el.autoplay = true; }
  out.appendChild(el);
  const p = document.createElement('p'); p.className = 'small';
  p.textContent = kind === 'gif' ? 'Press and hold the picture, then choose Save to Photos. Or use Share.' : 'Use Share to save it, or press play and use the video menu.';
  out.appendChild(p);
  const row = document.createElement('div'); row.className = 'row c'; out.appendChild(row);
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    const b = document.createElement('button'); b.className = 'pri'; b.textContent = 'Share / save';
    b.onclick = async () => { try { await navigator.share({ files: [file], title: 'Revrb' }); } catch (e) { if (e && e.name !== 'AbortError') say('Share did not open: ' + e.name); } };
    row.appendChild(b);
  }
  const a = document.createElement('a'); a.className = 'dl'; a.href = url; a.download = name; a.textContent = 'Download'; row.appendChild(a);
  say((blob.size / 1024 / 1024).toFixed(2) + ' MB');
  out.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

$('expGif').onclick = async () => {
  if (state.busy || !state.proc.length) return; state.busy = true; $('expGif').disabled = true;
  try {
    const o = order(), W = state.W, H = state.H, gif = GIFENC.GIFEncoder(), delay = Math.round(1000 / state.fps);
    for (let k = 0; k < o.length; k++) {
      say('Making GIF... ' + (k + 1) + ' / ' + o.length);
      await wait(0);
      const data = state.proc[o[k]].data, palette = GIFENC.quantize(data, 256), index = GIFENC.applyPalette(data, palette);
      gif.writeFrame(index, W, H, { palette, delay });
    }
    gif.finish();
    offerFile(new Blob([gif.bytes()], { type: 'image/gif' }), 'revrb-' + Date.now() + '.gif', 'gif');
  } catch (e) { say('GIF failed: ' + (e && e.message ? e.message : e)); }
  state.busy = false; $('expGif').disabled = false;
};

$('expVid').onclick = async () => {
  if (state.busy || !state.proc.length) return;
  if (!window.MediaRecorder || !view.captureStream) { say('This browser cannot make a video here. Use the GIF.'); return; }
  state.busy = true; $('expVid').disabled = true;
  try {
    const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
    const mime = types.find((t) => MediaRecorder.isTypeSupported(t));
    if (!mime) throw new Error('no video format available');
    const stream = view.captureStream(state.fps), rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 4000000 }), chunks = [];
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    const done = new Promise((res) => (rec.onstop = res));
    const o = order(); const loops = Math.max(2, Math.ceil(3 / (o.length / state.fps)));
    stopLoop(); rec.start(); say('Recording video...');
    for (let l = 0; l < loops; l++) for (let k = 0; k < o.length; k++) { vctx.putImageData(state.proc[o[k]], 0, 0); await wait(1000 / state.fps); }
    rec.stop(); await done;
    const ext = mime.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
    offerFile(new Blob(chunks, { type: mime.split(';')[0] }), 'revrb-' + Date.now() + '.' + ext, 'video');
    startLoop();
  } catch (e) { say('Video failed: ' + (e && e.message ? e.message : e) + '. Use the GIF.'); startLoop(); }
  state.busy = false; $('expVid').disabled = false;
};

buildUI();
</script>
</body>
</html>
